name: nfl-sim

on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours: re-pulls rosters, depth charts, injuries, then re-simulates.
                              # Script exits quietly if no games are upcoming. Change to "0 13 * * *" for once a day.
  workflow_dispatch:           # lets you press "Run workflow" by hand
    inputs:
      sims:
        description: "Simulations per game"
        default: "2000"

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/ingest.py
      - run: python src/run_slate.py --sims ${{ github.event.inputs.sims || '2000' }}
      - run: python src/build_html.py
      - name: Commit results
        run: |
          git config user.name "nfl-sim-bot"
          git config user.email "nfl-sim-bot@users.noreply.github.com"
          git add docs/index.html output/slate.json
          git diff --staged --quiet || (git commit -m "Update slate $(date -u +%F)" && git push)
